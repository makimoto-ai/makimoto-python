name: Publish to PyPI

# Deliberately workflow_dispatch-only, never automatic. A bad publish here
# can't be deleted or overwritten. Run publish-testpypi.yml first and check
# the result before ever running this one. When triggering manually, pick
# the exact tag (e.g. v0.1.0) in the "Use workflow from" branch/tag
# selector, not "main", so what gets built matches what was actually
# released.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi  # must match the environment name set on the pending
                  # publisher registered at pypi.org
      url: https://pypi.org/project/makimoto-kawa/
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC), no token/secret
                       # needed
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
