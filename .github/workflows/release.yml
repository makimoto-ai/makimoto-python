name: Release

on:
  # TEMPORARILY manual-only (workflow_dispatch) while cleaning up two bad
  # auto-created releases (v1.0.0, v1.0.1) caused by a config gap. Switch
  # back to `push: branches: [main]` once verified via a manual run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-semantic-release
      - name: Compute next version from Conventional Commits, tag, update CHANGELOG.md, create a GitHub release
        run: semantic-release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
