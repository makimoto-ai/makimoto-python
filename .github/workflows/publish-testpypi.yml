name: Publish to TestPyPI

# Dry run of the real publish workflow, same mechanism, against test.pypi.org

on:
  workflow_dispatch:

permissions:
  id-token: write  # PyPI Trusted Publishing (OIDC), no token/secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: testpypi  # must match the environment name set on the
                           # pending publisher registered at test.pypi.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
