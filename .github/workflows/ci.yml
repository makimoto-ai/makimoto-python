name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: mypy src/makimoto --strict
      - run: pytest

  commit-lint:
    # Re-checks commit messages server-side, a local hook alone can be
    # bypassed (--no-verify, or a machine that never installed it), this
    # is the actual enforcement a contributor can't skip.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gitlint
      - run: gitlint --commits origin/${{ github.event.pull_request.base.ref }}..HEAD
